name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$TITLE" = Development ]; then
            exit 0
          fi
          case "$TITLE" in
            Revert\ \"*|Merge\ *) exit 0 ;;
          esac
          if [ "${#TITLE}" -gt 72 ]; then
            printf '%s\n' 'PR title must follow Conventional Commits (e.g. fix(nav): scroll to top on route change)'
            exit 1
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?(!)?: .+$'
          if [[ $TITLE =~ $pattern ]]; then
            exit 0
          fi
          printf '%s\n' 'PR title must follow Conventional Commits (e.g. fix(nav): scroll to top on route change)'
          exit 1